# Publish MkDocs to GitHub Pages (project site).
# URL: https://rohan033.github.io/backtrading-demo/
#
# REQUIRED once (or deploy returns 404 Not Found):
#   https://github.com/rohan033/backtrading-demo/settings/pages
#   Build and deployment → Source → "GitHub Actions" (not "Deploy from a branch")
#   Save, then re-run this workflow.

name: docs

on:
  push:
    branches: [main, master, tvstack]
    paths:
      - "documentation/**"
      - "architecture/**"
      - "docs/**"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "env.example"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[docs]"

      - run: mkdocs build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
