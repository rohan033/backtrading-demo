[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtrading"
version = "0.1.0"
description = "Modular trading backend with control plane and live engine"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "websockets",
  "requests",
  "httpx>=0.27",
]

[project.optional-dependencies]
angel = ["smartapi-python", "pyotp", "logzero", "tabulate"]
etoro = []
telegram = []
cursor = ["cursor-sdk>=0.1.5", "fastmcp>=2.0.0"]
dev = ["ruff>=0.4.0"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-include-markdown-plugin>=6.2",
  "mkdocs-mermaid2-plugin>=1.2",
]

[project.scripts]
backtrading = "backtrading.commands.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
